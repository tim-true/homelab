global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    monitor: 'homelab-monitor'
    environment: 'production'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'node0'
          host: '192.168.1.100'
      - targets: ['192.168.1.101:9100']
        labels:
          instance: 'node1'
          host: '192.168.1.101'

